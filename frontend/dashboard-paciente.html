<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Paciente - MediMicro IPS</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --input-bg: #ffffff;
            --input-border: #ccc;
            --btn-bg: #007bff;
            --btn-hover: #0056b3;
            --header-bg: #007bff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --card-bg: #1e1e1e;
                --text-color: #e0e0e0;
                --input-bg: #2d2d2d;
                --input-border: #444;
                --btn-bg: #0d6efd;
                --btn-hover: #0b5ed7;
                --header-bg: #1f1f1f;
            }
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h2 { color: var(--btn-bg); }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--input-border);
            border-radius: 4px;
        }

        button {
            padding: 10px 15px;
            background-color: var(--btn-bg);
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: var(--btn-hover); }

        .logout-btn { background-color: #dc3545; }
        .logout-btn:hover { background-color: #b02a37; }
    </style>
</head>
<body>

    <header>
        <h2>MediMicro - Portal del Paciente</h2>
        <button class="logout-btn" onclick="cerrarSesion()">Cerrar Sesión</button>
    </header>

    <div class="container">
        <!-- Sección para Agendar Cita -->
        <div class="card">
            <h3>Agendar Nueva Cita</h3>
            <form id="citaForm">
                <div class="form-group">
                    <label for="agenda">Horarios disponibles:</label>
                    <select id="agenda" required>
                        <option value="">Cargando...</option>
                    </select>
                </div>
                <button type="submit">Solicitar Cita</button>
                <div id="msg" style="margin-top:10px;font-size:14px;"></div>
            </form>
        </div>

        <!-- Sección de Mis Citas -->
        <div class="card">
            <h3>Mis Citas Programadas</h3>
            <ul id="listaCitas">
                <li>Cargando citas...</li>
            </ul>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
        }

        const authHeaders = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
        };

        function cerrarSesion() {
            localStorage.removeItem('token');
            localStorage.removeItem('rol');
            localStorage.removeItem('username');
            window.location.href = 'login.html';
        }

        function formatearFecha(iso) {
            return new Date(iso).toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' });
        }

        function mostrarMsg(texto, color) {
            const m = document.getElementById('msg');
            m.style.color = color;
            m.textContent = texto;
        }

        async function cargarAgendas() {
            const select = document.getElementById('agenda');
            try {
                const res = await fetch(`${CITAS_URL}/api/agendas`, { headers: authHeaders });
                if (res.status === 401) return cerrarSesion();
                const agendas = await res.json();

                select.innerHTML = '';
                if (!Array.isArray(agendas) || agendas.length === 0) {
                    select.innerHTML = '<option value="">No hay horarios disponibles</option>';
                    return;
                }
                agendas.forEach(a => {
                    const opt = document.createElement('option');
                    opt.value = a.id;
                    opt.textContent = `Agenda #${a.id} - ${formatearFecha(a.fecha_hora)}`;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error(err);
                select.innerHTML = '<option value="">Error al cargar horarios</option>';
            }
        }

        async function cargarCitas() {
            const lista = document.getElementById('listaCitas');
            try {
                const res = await fetch(`${CITAS_URL}/api/citas/mias`, { headers: authHeaders });
                if (res.status === 401) return cerrarSesion();
                const citas = await res.json();

                lista.innerHTML = '';
                if (!Array.isArray(citas) || citas.length === 0) {
                    lista.innerHTML = '<li>Aún no tienes citas.</li>';
                    return;
                }
                citas.forEach(c => {
                    const li = document.createElement('li');
                    li.textContent = `${formatearFecha(c.fecha_hora)} (${c.estado})`;
                    lista.appendChild(li);
                });
            } catch (err) {
                console.error(err);
                lista.innerHTML = '<li>No se pudieron cargar las citas.</li>';
            }
        }

        document.getElementById('citaForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const agenda_id = document.getElementById('agenda').value;
            if (!agenda_id) return mostrarMsg('Selecciona un horario.', 'red');

            try {
                const res = await fetch(`${CITAS_URL}/api/citas`, {
                    method: 'POST',
                    headers: authHeaders,
                    body: JSON.stringify({ agenda_id: Number(agenda_id) })
                });
                const data = await res.json();

                if (res.ok) {
                    mostrarMsg('¡Cita agendada con éxito!', 'green');
                    cargarAgendas();
                    cargarCitas();
                } else if (res.status === 401) {
                    cerrarSesion();
                } else {
                    mostrarMsg(data.error || 'Error al agendar la cita', 'red');
                }
            } catch (err) {
                console.error(err);
                mostrarMsg('No se pudo conectar con el servicio de citas.', 'red');
            }
        });

        cargarAgendas();
        cargarCitas();
    </script>
</body>
</html>
