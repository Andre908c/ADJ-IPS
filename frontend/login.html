<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediMicro Services - Login</title>
<style>
    :root {
        --bg-color: #f4f7f6;
        --card-bg: #ffffff;
        --text-color: #333333;
        --input-bg: #ffffff;
        --input-border: #ccc;
        --btn-bg: #007bff;
        --btn-hover: #0056b3;
    }

    /* Detección automática del Modo Oscuro del sistema operativo/navegador */
    @media (prefers-color-scheme: dark) {
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --input-bg: #2d2d2d;
            --input-border: #444;
            --btn-bg: #0d6efd;
            --btn-hover: #0b5ed7;
        }
    }

    body {
        font-family: Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        transition: background-color 0.3s ease, color 0.3s ease;
    }

    .login-card {
        background: var(--card-bg);
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        width: 300px;
        transition: background-color 0.3s ease;
    }

    .login-card h2 {
        text-align: center;
        color: var(--btn-bg);
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        margin-bottom: 5px;
    }

    .form-group input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        background-color: var(--input-bg);
        color: var(--text-color);
        border: 1px solid var(--input-border);
        border-radius: 4px;
    }

    button {
        width: 100%;
        padding: 10px;
        background-color: var(--btn-bg);
        border: none;
        color: white;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background-color: var(--btn-hover);
    }

    #error-msg {
        color: #ff6b6b;
        text-align: center;
        margin-top: 10px;
        font-size: 14px;
    }
</style>
</head>
<body>

    <div class="login-card">
        <h2>MediMicro IPS</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Ingresar</button>
            <div id="error-msg"></div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            errorMsg.textContent = '';

            try {
                // Petición hacia el API Gateway (puerto 3000)
                const response = await fetch('http://localhost:3000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Guardar token y redirigir según el rol o usuario
                    localStorage.setItem('token', data.token);
                    alert('¡Login exitoso!');
                    
                    // Redirección simulada (aquí mandaremos al dashboard médico o de paciente)
                    if (username === 'admin') {
                        window.location.href = 'dashboard-medico.html';
                    } else {
                        window.location.href = 'dashboard-paciente.html';
                    }
                } else {
                    errorMsg.textContent = data.error || 'Credenciales incorrectas';
                }
            } catch (err) {
                errorMsg.textContent = 'No se pudo conectar con el servidor.';
                console.error(err);
            }
        });
    </script>
</body>
</html>
