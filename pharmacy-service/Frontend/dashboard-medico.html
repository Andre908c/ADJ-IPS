<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Médico - MediMicro IPS</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --btn-bg: #198754;
            --btn-hover: #157347;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --card-bg: #1e1e1e;
                --text-color: #e0e0e0;
                --btn-bg: #20c997;
                --btn-hover: #1aa179;
            }
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h2 { color: var(--btn-bg); }
        .logout-btn { background-color: #dc3545; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h2>MediMicro - Panel del Personal Médico</h2>
        <button class="logout-btn" onclick="cerrarSesion()">Cerrar Sesión</button>
    </header>

    <div class="card">
        <h3>Gestión de Pacientes y Asignaciones</h3>
        <p>Aquí el personal médico puede visualizar las agendas de los pacientes, historiales clínicos y realizar llamadas o asignaciones directas.</p>
        <div id="panel-medico-content">
            <!-- Contenido dinámico del microservicio -->
            <p><strong>Pacientes en espera:</strong> 3</p>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
        }

        function cerrarSesion() {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
