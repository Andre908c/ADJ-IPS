version: '3.8'

services:
  api-gateway:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - USERS_SERVICE_URL=http://auth-service:3001
      - PRODUCTS_SERVICE_URL=http://products-service:3002
    depends_on:
      - auth-service

  auth-service:
    build:
      context: ./auth-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001